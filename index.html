
<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AURAMINI V7</title>
<style>
body{font-family:sans-serif;background:#ffeef5;margin:0}
.header{background:linear-gradient(135deg,#ff7b9c,#ff5e8a);color:white;padding:20px;text-align:center;border-radius:0 0 20px 20px}
.chat{padding:15px;display:flex;flex-direction:column;gap:10px;min-height:60vh}
.bubble{max-width:80%;padding:12px 16px;border-radius:18px}
.ai{background:white;align-self:flex-start;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.me{background:linear-gradient(135deg,#ff7b9c,#ff5e8a);color:white;align-self:flex-end}
.input{display:flex;gap:8px;padding:12px;background:white}
input{flex:1;padding:12px;border-radius:20px;border:1px solid #ffd1dc}
button{padding:12px 16px;border:none;border-radius:20px;background:#ff5e8a;color:white}
</style>
</head>
<body>
<div class="header"><h2>💖 AURAMINI V7 💖</h2><p>Bisa Chat & Baca Gambar</p></div>
<div class="chat" id="chat"><div class="bubble ai">Halo sayang! 💖 Aku AURAMINI V7 yang sudah diperbaiki.</div></div>
<div class="input">
<input type="file" id="img" accept="image/*" style="display:none">
<button onclick="document.getElementById('img').click()">📷</button>
<input id="msg" placeholder="Ketik pesan...">
<button onclick="send()">💌</button>
</div>
<script>
let selectedImage=null;
document.getElementById('img').addEventListener('change',e=>{selectedImage=URL.createObjectURL(e.target.files[0]);addBubble('Foto dipilih, ketik pertanyaan tentang foto ini','me');});
function addBubble(text,cls){const c=document.getElementById('chat');const d=document.createElement('div');d.className='bubble '+cls;d.textContent=text;c.appendChild(d);}
function send(){const input=document.getElementById('msg');const text=input.value.trim();if(!text&&!selectedImage)return;addBubble(text||'Lihat foto ini','me');input.value='';setTimeout(()=>{if(selectedImage){addBubble('Aku melihat gambar kamu sayang! Mau aku jelaskan bagian mana?');selectedImage=null;}else{addBubble(reply(text));}},600);}
function reply(t){t=t.toLowerCase();if(t.includes('merdeka'))return 'Indonesia merdeka 17 Agustus 1945 sayang, oleh Soekarno dan Hatta.';if(t.includes('halo')||t.includes('hai'))return 'Halo sayang! Ada yang bisa aku bantu?';return 'Baik sayang, aku paham: "'+t+'". Ceritakan lebih detail ya.';}
document.getElementById('msg').addEventListener('keydown',e=>{if(e.key==='Enter')send();});
</script>
</body>
</html>
